server:
  port: 8080

spring:
  application:
    name: evoluicv-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

evoluicv:
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    # max-tokens inclui o raciocínio adaptativo do modelo, não só o JSON
    analyst:
      model: ${AI_ANALYST_MODEL:claude-haiku-5-5}
      effort: ${AI_ANALYST_EFFORT:medium}
      max-tokens: ${AI_ANALYST_MAX_TOKENS:16000}
    suggestions:
      model: ${AI_SUGGESTIONS_MODEL:claude-haiku-5-5}
      effort: ${AI_SUGGESTIONS_EFFORT:medium}
      max-tokens: ${AI_SUGGESTIONS_MAX_TOKENS:16000}
  quota:
    per-ip-daily: ${QUOTA_PER_IP_DAILY:3}
    global-daily: ${QUOTA_GLOBAL_DAILY:200}
    zone: America/Sao_Paulo

logging:
  level:
    com.evoluicv.backend: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: evoluicv-backend