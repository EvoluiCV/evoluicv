server:
  port: 8080

spring:
  application:
    name: evoluicv-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

evoluicv:
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    # max-tokens inclui o raciocínio adaptativo do modelo, não só o JSON
    analyst:
      model: ${AI_ANALYST_MODEL:claude-haiku-5-5}
      effort: ${AI_ANALYST_EFFORT:medium}
      max-tokens: ${AI_ANALYST_MAX_TOKENS:16000}
    suggestions:
      model: ${AI_SUGGESTIONS_MODEL:claude-haiku-5-5}
      effort: ${AI_SUGGESTIONS_EFFORT:medium}
      max-tokens: ${AI_SUGGESTIONS_MAX_TOKENS:16000}
    # US$ por milhão de tokens, só para o custo estimado nas métricas (evoluicv_ai_cost_usd_total).
    # Haiku 5.5 com prompt até 100K tokens; cache: escrita 1,25x e leitura 0,1x da entrada.
    # Confira na página de preços da Anthropic ao trocar de modelo; modelo fora da tabela conta custo zero.
    pricing:
      "[claude-haiku-5-5]":
        input: 0.10
        output: 0.50
        cache-read: 0.01
        cache-write: 0.125
  quota:
    per-ip-daily: ${QUOTA_PER_IP_DAILY:3}
    global-daily: ${QUOTA_GLOBAL_DAILY:200}
    zone: America/Sao_Paulo

logging:
  level:
    com.evoluicv.backend: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: evoluicv-backend
    distribution:
      # buckets para p50/p95 de latência por agente no Grafana
      percentiles-histogram:
        evoluicv.ai.calls: true